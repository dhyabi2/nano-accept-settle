[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-accept-settle"
version = "0.1.0"
description = "Non-custodial: confirm an answer passed its test and the asker's XNO payment settled, in one call"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/dhyabi2/nano-accept-settle"

[tool.setuptools]
packages = ["nano_accept_settle"]
